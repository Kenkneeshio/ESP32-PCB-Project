name: Build Parley Live APK

on:
  push:
    branches:
      - chatgpt-parley-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out temporary build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone Parley
        run: git clone --depth 1 https://github.com/sync-kyoto-jp/parley.git parley

      - name: Apply GPT-Live and audio-routing changes
        run: |
          base64 -d parley-live-overlay.b64 | tar -xz -C parley
          rm -f parley/app/src/main/java/jp/kyoto/sync/parley/net/TranslationSession.kt
          rm -f parley/app/src/main/java/jp/kyoto/sync/parley/net/RealtimeEvents.kt

      - name: Build debug APK
        working-directory: parley
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp parley/app/build/outputs/apk/debug/app-debug.apk output/Parley-Live-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parley-Live-debug-apk
          path: output/Parley-Live-debug.apk
          if-no-files-found: error
          retention-days: 7
