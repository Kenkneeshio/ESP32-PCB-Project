name: Fetch APK signer helper

on:
  push:
    branches:
      - chatgpt-apk-signer-helper3
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download signer
        run: |
          curl -L --fail --retry 3 https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -o uber-apk-signer.jar
          sha256sum uber-apk-signer.jar
      - name: Upload signer
        uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer-jar
          path: uber-apk-signer.jar
          retention-days: 1
