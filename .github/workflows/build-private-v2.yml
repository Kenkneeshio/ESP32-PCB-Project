name: Build Parley Live Private V3

on:
  push:
    branches:
      - chatgpt-parley-private-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone upstream Parley
        run: git clone --depth 1 https://github.com/sync-kyoto-jp/parley.git parley

      - name: Apply Smart base overlay
        run: |
          cat smart-overlay.part00 smart-overlay.part01 smart-overlay.part02 smart-overlay.part03 smart-overlay.part04 | base64 -d | tar -xz -C parley
          rm -f parley/app/src/main/java/jp/kyoto/sync/parley/net/TranslationSession.kt
          rm -f parley/app/src/main/java/jp/kyoto/sync/parley/net/RealtimeEvents.kt

      - name: Apply Private V2 overlay
        run: cat private-overlay.part00 private-overlay.part01 | base64 -d | tar -xz -C parley

      - name: Apply Private V3 audio routing overlay
        run: cat v3-overlay.part00 v3-overlay.part01 v3-overlay.part02 | base64 -d | tar -xz -C parley

      - name: Build debug APK
        working-directory: parley
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp parley/app/build/outputs/apk/debug/app-debug.apk output/Parley-Live-Private-V3-placeholder.apk
          sha256sum output/Parley-Live-Private-V3-placeholder.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Parley-Live-Private-V3-placeholder-apk
          path: output/Parley-Live-Private-V3-placeholder.apk
          if-no-files-found: error
          retention-days: 3
